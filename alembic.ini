# Configuración de Alembic. La URL real de la base sale de gimnasio.config
# (o de la variable ENFORMA_DB_URL); la de aquí solo se usa si se pasa con -x.
[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
