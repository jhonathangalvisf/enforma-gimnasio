[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gimnasio"
dynamic = ["version"]
description = "Sistema de gestión del gimnasio Enforma (escritorio, Windows)"
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = {attr = "gimnasio.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gimnasio = ["recursos/*.wav", "recursos/*.ico", "recursos/*.png", "ayuda/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "clave_admin_real: la prueba usa la clave de administrador de verdad (sin simularla)",
]
